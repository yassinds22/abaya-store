<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | لارين عباية</title>
    <meta name="description" content="لوحة التحكم لإدارة منتجات متجر لارين عباية، تعديل العبايات، حذفها وإضافة عروض وتصاميم جديدة.">
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ملفات التنسيق المخصصة -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

    <!-- شريط تسجيل الدخول للمشرف (يظهر في حال لم يسجل دخوله) -->
    <div class="admin-login-overlay" id="admin-login-overlay">
        <div class="login-card">
            <h2>دخول المشرف</h2>
            <p>يرجى إدخال كلمة المرور للوصول إلى لوحة التحكم وإدارة المنتجات</p>
            <form id="login-form">
                <div class="form-group" style="text-align: right;">
                    <label for="admin-password" class="form-label">كلمة المرور *</label>
                    <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
                </div>
                <div id="login-error" style="color: var(--color-wine); font-size: 0.85rem; margin-bottom: 15px; display: none; text-align: right; font-weight: bold;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-sign-in-alt"></i> دخول</button>
            </form>
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: var(--color-gold); font-size: 0.9rem; font-weight: bold;"><i class="fas fa-arrow-right"></i> العودة للموقع الرئيسي</a>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية للمدير (مخفية بشكل افتراضي وتظهر بالـ JS بعد نجاح تسجيل الدخول) -->
    <div class="admin-dashboard-container" id="admin-dashboard" style="display: none;">
        
        <!-- هيدر لوحة التحكم -->
        <header class="admin-header">
            <div>
                <h1>لوحة التحكم <span>إدارة متجر لارين عباية</span></h1>
            </div>
            <div style="display: flex; gap: 15px;">
                <a href="index.html" class="btn btn-secondary" style="border-color: var(--color-dark-brown); color: var(--color-dark-brown); padding: 8px 20px; font-size: 0.9rem;"><i class="fas fa-eye"></i> معاينة الموقع</a>
                <button id="logout-btn" class="btn btn-primary" style="background-color: var(--color-wine); color: var(--color-white); padding: 8px 20px; font-size: 0.9rem;"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>
        </header>

        <!-- شبكة لوحة التحكم -->
        <div class="admin-grid">
            
            <!-- العمود الأول: نموذج إضافة/تعديل منتج -->
            <div class="admin-card" id="admin-form-card">
                <h2 id="admin-form-title">إضافة منتج جديد</h2>
                <form id="product-form">
                    
                    <div class="form-group">
                        <label for="product-name" class="form-label">اسم العباية *</label>
                        <input type="text" id="product-name" class="form-control" placeholder="مثال: عباية ملكية مطرزة" required>
                    </div>

                    <div class="form-group">
                        <label for="product-price" class="form-label">السعر (ريال يمني) *</label>
                        <input type="number" id="product-price" class="form-control" placeholder="مثال: 30000" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="product-category" class="form-label">القسم *</label>
                        <select id="product-category" class="form-control" style="background-color: var(--color-white);" required>
                            <option value="" disabled selected>اختر القسم المناسب</option>
                            <option value="آخر الوافدين">آخر الوافدين</option>
                            <option value="الأكثر طلباً">الأكثر طلباً</option>
                            <option value="الكلاسيكية">الكلاسيكية</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="product-desc" class="form-label">الوصف الكامل والمميزات *</label>
                        <textarea id="product-desc" class="form-control" placeholder="تفاصيل حول نوع القماش، نوع التطريز، المقاسات المتوفرة..." required></textarea>
                    </div>

                    <!-- رفع الصورة كـ Base64 -->
                    <div class="form-group">
                        <label class="form-label">صورة العباية *</label>
                        <input type="file" id="product-image-file" accept="image/*" style="display: none;">
                        <div class="image-upload-preview" id="image-preview">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>اضغطي لرفع صورة العباية</span>
                            <span style="font-size: 0.7rem; display: block; margin-top: 5px;">(أو سيتم استخدام صورة تلقائية)</span>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 30px;">
                        <button type="submit" id="form-submit-btn" class="btn btn-primary" style="flex-grow: 1;"><i class="fas fa-plus"></i> حفظ المنتج</button>
                        <button type="button" id="btn-cancel-edit" class="btn btn-secondary" style="border-color: var(--color-wine); color: var(--color-wine); display: none;"><i class="fas fa-times"></i> إلغاء التعديل</button>
                    </div>

                </form>
            </div>

            <!-- العمود الثاني: جدول عرض وإدارة المنتجات -->
            <div class="admin-card">
                <h2>قائمة المنتجات الحالية</h2>
                
                <div class="admin-products-table-wrapper">
                    <table class="admin-products-table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">#</th>
                                <th style="width: 70px;">الصورة</th>
                                <th>اسم المنتج</th>
                                <th style="width: 120px;">القسم</th>
                                <th style="width: 120px;">السعر</th>
                                <th style="width: 150px;">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-tbody">
                            <!-- سيتم تعبئة البيانات ديناميكياً بـ JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- ملفات جافا سكريبت -->
    <script src="assets/js/whatsapp.js"></script>
    <script src="assets/js/products.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
